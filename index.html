<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding-top: 100px; margin: 0; }
.card { background: white; width: 90%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; border: 2px solid #002e5b; }
.banner { background: #002e5b; color: #ffcc00; padding: 20px; text-align: center; font-weight: bold; font-size: 20px; border-bottom: 5px solid #b8860b; }
.content { padding: 25px; text-align: center; }
.notice-text { background: #fffbe6; padding: 15px; border-radius: 10px; border: 1px dashed #b8860b; margin-bottom: 10px; font-size: 18px; color: #333; line-height: 1.6; min-height: 50px; }
.date-info { font-size: 11px; color: #777; margin-bottom: 20px; display: block; background: #eee; padding: 5px; border-radius: 5px; }
.btn-speak { background: #d93025; color: white; border: none; padding: 15px; border-radius: 50px; width: 60px; height: 60px; cursor: pointer; font-size: 20px; box-shadow: 0 4px 10px rgba(217,48,37,0.4); }
#loader { margin-bottom: 10px; font-weight: bold; color: #002e5b; }
</style>
</head>
<body onload="fetchNotice()">

<div class="card">
<div class="banner"><i class="fas fa-bullhorn"></i> SCHOOL NOTICE</div>
<div class="content">
<div id="loader">Loading Notice...</div>
<div class="notice-text" id="ntc" style="display:none;"></div>
<span class="date-info" id="dt" style="display:none;"><i class="far fa-clock"></i> Last Updated: </span>
<button class="btn-speak" id="spkBtn" style="display:none;" onclick="talk()"><i class="fas fa-volume-up"></i></button>
<p style="color:#d93025; font-weight:bold; margin-top:20px;">Thanks. Barsoi Public School</p>
</div>
</div>

<script>
// YAHAN APNA WEB APP URL DALEIN
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzHkChqTzfpa5kyg4W1cn7Aqn6vuKKTzWjfABEUMZCBqQTkzg50nctCvm2r4u53iNfVRQ/exec";

function fetchNotice() {
  fetch(WEB_APP_URL + "?action=getNotice")
    .then(res => res.json())
    .then(data => {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('ntc').innerText = data.text;
      document.getElementById('dt').innerHTML += data.date;
      document.getElementById('ntc').style.display = 'block';
      document.getElementById('dt').style.display = 'inline-block';
      document.getElementById('spkBtn').style.display = 'inline-block';
    })
    .catch(err => {
      document.getElementById('loader').innerText = "Could not load notice.";
    });
}

function talk() {
  var text = document.getElementById('ntc').innerText;
  var msg = new SpeechSynthesisUtterance();
  msg.text = text; msg.lang = 'hi-IN';
  window.speechSynthesis.speak(msg);
}
</script>
</body>
</html>
